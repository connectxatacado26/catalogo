<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect X Atacado — Catálogo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="cadastroSuccessBanner" style="display:none;background:#dcfce7;border-bottom:1px solid #86efac;color:#166534;padding:14px 20px;text-align:center;font-size:14px;font-weight:600;">
  ✅ Cadastro enviado com sucesso! Nossa equipe entrará em contato em breve. 🎉
</div>

<div class="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brandmark">
        <span class="name">Connect X Atacado</span>
        <span class="tag">catálogo para lojistas</span>
      </div>
      <div class="searchwrap" id="searchwrap">
        <input type="text" id="searchInput" placeholder="Buscar por nome, código ou marca…" autocomplete="off">
      </div>
      <div class="topbar-actions">
        <button class="btn cart-btn" id="openCartBtn" type="button" aria-label="Abrir carrinho">
          Carrinho <span class="cart-count" id="cartCount" style="display:none;">0</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Carrossel de banners (controlado pelo painel admin) -->
  <div id="siteBanner" class="site-banner" style="display:none;" role="complementary" aria-label="Banners promocionais">
    <div class="banner-track" id="bannerTrack"></div>
    <button class="banner-arrow banner-arrow-prev" id="bannerPrev" aria-label="Banner anterior" style="display:none;">&#8249;</button>
    <button class="banner-arrow banner-arrow-next" id="bannerNext" aria-label="Próximo banner" style="display:none;">&#8250;</button>
    <div class="banner-dots" id="bannerDots" style="display:none;"></div>
    <button class="site-banner-close" id="bannerClose" aria-label="Fechar banners">✕</button>
  </div>

  <div id="chiprow" class="chiprow"></div>

  <div id="catalogRoot">
    <div class="skeleton">Carregando catálogo…</div>
  </div>

  <div id="orderViewRoot" style="display:none;"></div>

  <div class="footer-note">Connect X Atacado &middot; pedidos enviados por WhatsApp são confirmados manualmente pela equipe. &nbsp;<a href="admin.html" style="color:var(--ink-faint);font-size:11px;text-decoration:none;">painel</a></div>
</div>

<div class="overlay" id="cartOverlay"></div>
<div class="drawer" id="cartDrawer" role="dialog" aria-label="Carrinho">
  <div class="drawer-head">
    <h2>Seu carrinho</h2>
    <button class="btn btn-icon btn-ghost" id="closeCartBtn" type="button" aria-label="Fechar carrinho">✕</button>
  </div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot" id="cartFoot"></div>
</div>


<div class="modal-overlay" id="checkoutModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>Finalizar pedido</h2>
      <button class="btn btn-icon btn-ghost" id="closeCheckoutModalBtn" type="button" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-body" id="checkoutModalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="cancelCheckoutBtn" type="button">Voltar</button>
      <button class="btn btn-accent" id="confirmCheckoutBtn" type="button">📲 Envie seu Pedido</button>
    </div>
  </div>
</div>

<div id="toastHost"></div>

<script src="js/config.js"></script>
<script type="module" src="js/app.js"></script>
<script>
(function () {
  if (new URLSearchParams(location.search).get('cadastro') === 'ok') {
    var banner = document.getElementById('cadastroSuccessBanner');
    if (banner) {
      banner.style.display = 'block';
      setTimeout(function () {
        banner.style.transition = 'opacity .5s';
        banner.style.opacity = '0';
        setTimeout(function () { banner.style.display = 'none'; }, 500);
      }, 5000);
    }
    history.replaceState({}, '', location.pathname);
  }
})();
</script>
</body>
</html>
